# FFmpeg library configuration for ffmpeg-sys-next
#
# Option 1: System FFmpeg via Homebrew (macOS development)
#   brew install ffmpeg
#   Then set FFMPEG_DIR to the Homebrew Cellar path:
#   FFMPEG_DIR = "/opt/homebrew/Cellar/ffmpeg/<version>"
#
# Option 2: Bundled FFmpeg (production)
#   Place FFmpeg libs in ffmpeg/{os}-{arch}/ next to the binary.
#   Set FFMPEG_DIR to that absolute path.
#
# Option 3: System FFmpeg via pkg-config (Linux)
#   apt install libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
#   No FFMPEG_DIR needed — pkg-config finds it automatically.

[env]
# Update this path when upgrading FFmpeg via Homebrew
FFMPEG_DIR = "/opt/homebrew/Cellar/ffmpeg/8.0.1"
# sqlx compile-time query checking against local dev DB
DATABASE_URL = "sqlite:linewise.db"
