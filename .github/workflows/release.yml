name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: linewise-desktop-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: linewise-desktop-windows-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linewise-desktop-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies (Tailwind CSS)
        run: npm ci

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # --- FFmpeg setup ---

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> $GITHUB_ENV

      - name: Install FFmpeg and system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev \
            libavdevice-dev \
            ffmpeg pkg-config patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            libxdo-dev

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegVersion = "7.1"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${ffmpegVersion}-latest-win64-gpl-shared-${ffmpegVersion}.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          $ffmpegDir = (Get-ChildItem ffmpeg-build -Directory)[0].FullName
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          # Add to PATH so pkg-config / build scripts find it
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      # --- ExifTool setup (capture-metadata embed/read-back) ---
      # macOS/Linux: the official source distribution (script + lib/), which
      # self-locates its modules and runs on system Perl. Windows: the standalone
      # build (exiftool.exe + exiftool_files/, embedded Perl). Pin the version.

      - name: Install ExifTool (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          EXIFTOOL_VERSION="13.55"
          curl -fsSL -o exiftool-src.tar.gz \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz"
          mkdir -p exiftool-dist
          tar xzf exiftool-src.tar.gz -C exiftool-dist --strip-components=1
          test -f exiftool-dist/exiftool && test -d exiftool-dist/lib
          echo "EXIFTOOL_DIST=$(pwd)/exiftool-dist" >> "$GITHUB_ENV"

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exiftoolVersion = "13.55"
          # exiftool.org keeps only the current version at the root; older ones
          # move to /older/. Try both so a pinned version keeps resolving after
          # upstream releases a newer one. (No GitHub binary release exists — the
          # repo is source-only — so exiftool.org is the canonical Windows source.)
          $zip = "exiftool-${exiftoolVersion}_64.zip"
          $urls = @("https://exiftool.org/$zip", "https://exiftool.org/older/$zip")
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile exiftool.zip; $ok = $true; Write-Host "Downloaded $u"; break }
            catch { Write-Host "Not at $u" }
          }
          if (-not $ok) { throw "ExifTool $exiftoolVersion not found at exiftool.org (root or /older/)" }
          Expand-Archive exiftool.zip -DestinationPath exiftool-dist -Force
          # The zip ships the launcher as `exiftool(-k).exe` next to `exiftool_files/`;
          # rename the launcher to `exiftool.exe` (the documented install step — the
          # PAR launcher still finds `exiftool_files/` by that fixed name).
          $launcher = Get-ChildItem exiftool-dist -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
          if (-not $launcher) { throw "exiftool(-k).exe not found in the downloaded zip" }
          $distDir = $launcher.Directory.FullName
          Move-Item $launcher.FullName (Join-Path $distDir "exiftool.exe") -Force
          if (-not (Test-Path (Join-Path $distDir "exiftool_files"))) {
            Write-Host "::warning::exiftool_files/ not found next to the launcher — the standalone may not run"
          }
          echo "EXIFTOOL_DIST=$distDir" >> $env:GITHUB_ENV

      # --- Build ---

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p lw-app

      - name: Install cargo-bundle
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Bundle application
        if: runner.os != 'Windows'
        working-directory: crates/lw-app
        run: cargo bundle --release --target ${{ matrix.target }}

      # --- macOS code signing (self-signed identity) ---

      - name: Import self-signed code signing cert (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/linewise-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Put our keychain ahead of login.keychain so codesign finds the identity
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          # `-v` filters on trust chain validity, which a self-signed cert
          # never satisfies. codesign itself only needs the codeSigning EKU
          # plus an accessible private key, so we list all identities and
          # match by CN substring.
          IDENTITY=$(security find-identity "$KEYCHAIN_PATH" | awk -F '"' '/Linewise Desktop/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No code-signing identity imported"
            security find-identity "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # --- Bundle FFmpeg ---

      - name: Bundle FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: cargo xtask bundle-ffmpeg --target ${{ matrix.target }} --create-dmg

      - name: Bundle FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: cargo xtask bundle-ffmpeg --target ${{ matrix.target }}

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask bundle-ffmpeg --target ${{ matrix.target }}

      # cargo-bundle's MSI path is broken for our setup (hyphenated bin name
      # + missing `--format msi` detection), so we ship the unpacked release
      # directory as a zip. We stage an explicit allowlist: the app exe, the
      # FFmpeg DLLs, and the bundled CLIs (ffmpeg/ffprobe) + ExifTool (exe +
      # its exiftool_files/ PAR folder). The resolve_* helpers find each next to
      # linewise-desktop.exe, so the flat staging layout must mirror that.
      - name: Zip Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseDir = "target\${{ matrix.target }}\release"
          $ZipPath = "target\linewise-desktop-windows-x86_64.zip"
          $Staging = "$env:RUNNER_TEMP\linewise-desktop"
          New-Item -ItemType Directory -Force -Path $Staging | Out-Null
          Copy-Item "$ReleaseDir\linewise-desktop.exe" $Staging
          Copy-Item "$ReleaseDir\*.dll" $Staging -ErrorAction SilentlyContinue
          Copy-Item "$ReleaseDir\ffmpeg.exe" $Staging -ErrorAction SilentlyContinue
          Copy-Item "$ReleaseDir\ffprobe.exe" $Staging -ErrorAction SilentlyContinue
          # ExifTool is required for capture metadata — fail if the bundler didn't
          # produce it, rather than silently ship a Windows build that can't embed.
          Copy-Item "$ReleaseDir\exiftool.exe" $Staging
          Copy-Item "$ReleaseDir\exiftool_files" $Staging -Recurse -ErrorAction SilentlyContinue
          # Smoke test: the standalone must launch from the staged layout.
          & "$Staging\exiftool.exe" -ver
          if ($LASTEXITCODE -ne 0) { throw "bundled exiftool.exe failed to run" }
          Compress-Archive -Path "$Staging\*" -DestinationPath $ZipPath -Force
          Write-Host "Created $ZipPath"

      # --- Upload artifacts ---

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/linewise-desktop-macos-*.dmg

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/linewise-desktop-windows-x86_64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
