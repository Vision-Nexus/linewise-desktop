name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: linewise-desktop-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: linewise-desktop-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: linewise-desktop-windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linewise-desktop-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies (Tailwind CSS)
        run: npm ci

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # --- FFmpeg setup ---

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> $GITHUB_ENV

      - name: Install FFmpeg and system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev \
            ffmpeg pkg-config patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegVersion = "7.1"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${ffmpegVersion}-latest-win64-gpl-shared-${ffmpegVersion}.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          $ffmpegDir = (Get-ChildItem ffmpeg-build -Directory)[0].FullName
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          # Add to PATH so pkg-config / build scripts find it
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      # --- Build ---

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p lw-app

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Bundle application
        working-directory: crates/lw-app
        run: cargo bundle --release --target ${{ matrix.target }}

      # --- Bundle FFmpeg ---

      - name: Bundle FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/bundle-ffmpeg-macos.sh
          CREATE_DMG=1 bash scripts/bundle-ffmpeg-macos.sh ${{ matrix.target }}

      - name: Bundle FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/bundle-ffmpeg-linux.sh
          bash scripts/bundle-ffmpeg-linux.sh ${{ matrix.target }}

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-ffmpeg-windows.ps1

      # --- Upload artifacts ---

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/linewise-desktop-macos-*.dmg

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Windows .msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/bundle/msi/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
