name: Test

on:
  push:
    branches:
      - master
      - develop
      - testing
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # Single canonical FFmpeg version — must match release.yml and
  # `BUNDLED_FFMPEG_VERSION` in crates/xtask/src/bundle_ffmpeg/mod.rs. One
  # ffmpeg everywhere is required for cross-producer PDQ bit-exactness
  # (crates/lw-core/src/pdq.rs::PDQ_VF_FILTER).
  # WARNING / TBD / PLACEHOLDER: 7.1 matches Windows today; canonical version pending a
  # prod hash-divergence measurement. Only Windows is pinned to it so far —
  # macOS (brew) and Linux (apt) alignment is a tracked follow-up.
  BUNDLED_FFMPEG_VERSION: "7.1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies (Tailwind CSS)
        run: npm ci

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-test-

      # --- FFmpeg setup (mirrors release.yml so test and release agree on
      #     the libavcodec/libavformat ABI in scope). ---

      # NOTE: brew installs current ffmpeg (~8.x), NOT BUNDLED_FFMPEG_VERSION.
      # macOS is not yet aligned to the canonical pin (tracked follow-up).
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> $GITHUB_ENV

      # NOTE: apt installs ffmpeg ~6.1, NOT BUNDLED_FFMPEG_VERSION. Linux is not
      # yet aligned to the canonical pin (tracked follow-up).
      - name: Install FFmpeg and system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev \
            libavdevice-dev \
            ffmpeg pkg-config

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to the single canonical version (see top-level env).
          $ffmpegVersion = "${{ env.BUNDLED_FFMPEG_VERSION }}"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${ffmpegVersion}-latest-win64-gpl-shared-${ffmpegVersion}.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          $ffmpegDir = (Get-ChildItem ffmpeg-build -Directory)[0].FullName
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      # --- Linux-only system deps for lw-app (Dioxus desktop shell). ---
      - name: Install lw-app system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev

      # --- Lint, build, and tests for the full workspace. lw-core carries
      #     the test suite; lw-app proves the desktop shell still builds.
      #     Order matters: fmt and clippy first to fail fast on style/lint
      #     before spending time on a full build. ---

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      - name: cargo build
        run: cargo build --locked --workspace

      - name: cargo test
        run: cargo test --locked --workspace
