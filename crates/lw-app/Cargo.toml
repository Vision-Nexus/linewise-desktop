[package]
name = "lw-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "linewise-desktop"
path = "src/main.rs"

[dependencies]
lw-core = { path = "../lw-core" }
lw-chat = { path = "../lw-chat" }
dioxus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sentry = { workspace = true }
sentry-tracing = { workspace = true }
uuid = { workspace = true }
rfd = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Linewise Desktop"
identifier = "io.linewise.desktop"
icon = ["../../assets/icons/icon.icns", "../../assets/icons/icon.ico", "../../assets/icons/icon.png"]
copyright = "Copyright (c) 2024 Linewise. All rights reserved."
category = "public.app-category.productivity"
short_description = "Desktop client for Linewise video management"
long_description = "Linewise Desktop handles data desensitization, resumable uploads, video validation, and action camera integration."

[package.metadata.bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
section = "video"
