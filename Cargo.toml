[workspace]
resolver = "2"
members = ["crates/lw-core", "crates/lw-app", "crates/xtask"]
default-members = ["crates/lw-core", "crates/lw-app"]
exclude = ["crates/lw-chat"]

[workspace.package]
version = "0.1.3-rc8"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Linewise <dev@linewise.io>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.13", features = ["rustls", "json", "stream", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Error handling
thiserror = "2"

# Version comparison (used by the startup version check against GitHub Releases)
semver = "1"


# Logging & error tracking
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sentry = { version = "0.38", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.38"

# FFmpeg
ffmpeg-next = "8"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
md-5 = "0.10"
# CRC32C (Castagnoli) for the GCS-shape `Digest.crc32c` leg sent on
# `POST /documents`. Streaming via `crc32c_append`; SSE4.2 / ARMv8 CRC
# instructions in release builds. Wire-format compatibility with
# linewise-api's `Crc32c` opaque type — no equivalent in the existing
# hash crates.
crc32c = "0.6"
# SHA-256 over the first 256 KiB of the source file for the
# `Digest.sha256_head_256kib` leg. RustCrypto family, same shape as the
# existing `md-5 = "0.10"` dep.
sha2 = "0.10"
# PDQ perceptual hash (Meta's image hash) for Tier-2 near-duplicate
# detection. New-crate justification: there is no PDQ hasher in-tree, and
# the byte/blake3/md5/crc/sha crates above are all exact-content hashes —
# none survive a re-encode / metadata edit, which is exactly the case PDQ
# catches. Pure-Rust port (no C++/LGPL), re-exports `image`. The server
# stores `bit(256)` and compares via Hamming, so the desktop hash MUST be
# bit-exact with the browser/sidecar hash space — gated OFF
# (`pdq::PDQ_ENABLED = false`) until a distance-0-vs-sidecar CI gate passes.
pdqhash = "0.1"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
backon = "1"
url = "2"
notify = "8"
notify-debouncer-mini = "0.7"

# Streaming
bytes = "1"
futures-core = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

# Markdown
pulldown-cmark = "0.12"

# Base64 — used for unverified JWT claim decoding (Firebase ID tokens
# are RS256-signed by Firebase; the backend is the security boundary,
# the desktop reads claims locally only to gate admin-only UI).
base64 = "0.22"

# UI
dioxus = { version = "0.7.9", features = ["desktop"] }
rfd = "0.17"

# OAuth (PKCE loopback flow for Google/Microsoft sign-in)
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
tiny_http = "0.12"
webbrowser = "1"
