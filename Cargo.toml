[workspace]
resolver = "2"
members = ["crates/lw-core", "crates/lw-chat", "crates/lw-app", "crates/xtask"]
default-members = ["crates/lw-core", "crates/lw-chat", "crates/lw-app"]

[workspace.package]
version = "0.0.11-test"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Linewise <dev@linewise.io>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.13", features = ["rustls", "json", "stream", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Error handling
thiserror = "2"

# Version comparison (used by the startup version check against GitHub Releases)
semver = "1"


# Logging & error tracking
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sentry = { version = "0.38", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.38"

# FFmpeg
ffmpeg-next = "8"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
md-5 = "0.10"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
backon = "1"
url = "2"
notify = "8"
notify-debouncer-mini = "0.7"

# Streaming
bytes = "1"
futures-core = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

# Markdown
pulldown-cmark = "0.12"

# Base64 — used for unverified JWT claim decoding (Firebase ID tokens
# are RS256-signed by Firebase; the backend is the security boundary,
# the desktop reads claims locally only to gate admin-only UI).
base64 = "0.22"

# UI
dioxus = { version = "0.7.9", features = ["desktop"] }
rfd = "0.17"

# OAuth (PKCE loopback flow for Google/Microsoft sign-in)
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
tiny_http = "0.12"
webbrowser = "1"
